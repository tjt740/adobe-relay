# Public HTTPS entry for the original Sub2API service.
# Certificate is renewed by sub2api-cert-renew.timer.
map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen 6660 ssl;
    server_name 47.106.176.71;
    ssl_certificate /etc/letsencrypt/live/sub2api-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub2api-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Sub2apiTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 256m;

    # Preserve method/body when HTTP is sent to the old browser port.
    error_page 497 =308 https://47.106.176.71$request_uri;

    location / {
        proxy_pass http://127.0.0.1:6666;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sub2api_connection_upgrade;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
