name: Deploy Adobe Relay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-relay-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: failover-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check deployment scripts and backend
        env:
          PROXY_FAILOVER_TEST_DATABASE_URL: postgres://postgres:failover-test@localhost:5432/postgres?sslmode=disable
        run: |
          bash -n deploy/clash/release-online.sh
          bash -n deploy/primary/release.sh
          bash -n deploy/online/renew-ip-certificate.sh
          python3 -m unittest discover -s deploy/clash -p 'test_*.py'
          python3 -m unittest discover -s deploy/primary -p 'test_*.py'
          cd backend
          go test -race ./internal/clash ./internal/proxyfailover
          go test ./internal/repository -run 'TestExpiryRespectsLiveFailoverPolicy|TestProxyUpdate'
          go test -tags unit ./internal/service -run 'Test(GetAdobeUsage|AdobeUsage|BuildAdobeDegradedUsage|AccountTestServiceSendErrorAndEnd)'
      - name: Check frontend workflows
        run: |
          npm install -g pnpm@9.15.9
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          pnpm --dir frontend exec vitest run src/__tests__/integration/clash-subscription.spec.ts src/views/admin/__tests__/ProxiesView.filters.spec.ts src/components/account/__tests__/ProxyFailoverPanel.spec.ts src/components/admin/proxy/__tests__/ProxyAllocationModal.spec.ts src/components/account/__tests__/EditAccountModal.spec.ts src/components/account/__tests__/AccountUsageCell.spec.ts src/components/common/__tests__/ProxySelector.testing.spec.ts src/views/admin/__tests__/AccountsView src/components/admin/account/__tests__/AccountBulkActionsBar.spec.ts src/components/admin/account/__tests__/AccountTestModal.spec.ts src/components/account/__tests__/AccountStatusIndicator.spec.ts
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: adobe-relay:${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bundle application
        env:
          IMAGE: adobe-relay:${{ github.sha }}
        run: |
          docker save "$IMAGE" | gzip > release-images.tar.gz
          sha256sum release-images.tar.gz > release-images.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: |
            release-images.tar.gz
            release-images.tar.gz.sha256
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Deploy primary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-images
      - name: Verify image archive and configure SSH
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          sha256sum -c release-images.tar.gz.sha256
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload, back up and deploy
        env:
          DEPLOY_HOST: 173.234.15.150
          IMAGE: adobe-relay:${{ github.sha }}
        run: |
          set -euo pipefail
          target="root@$DEPLOY_HOST"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20)
          ssh "${ssh_opts[@]}" "$target" 'mkdir -p /opt/adobe-relay/deploy/primary'
          scp "${ssh_opts[@]}" deploy/primary/{release.sh,README.md} "$target:/opt/adobe-relay/deploy/primary/"
          gzip -dc release-images.tar.gz | ssh "${ssh_opts[@]}" "$target" 'docker load'
          ssh "${ssh_opts[@]}" "$target" "bash /opt/adobe-relay/deploy/primary/release.sh '$IMAGE'"
      - name: Verify public HTTPS endpoint
        env:
          HEALTH_URL: https://creative.cheap/health
        run: curl --fail --show-error --retry 6 --retry-delay 5 --max-time 30 "$HEALTH_URL"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
