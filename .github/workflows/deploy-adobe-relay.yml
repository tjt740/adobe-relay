name: Deploy Adobe Relay
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Run all checks and build an image without replacing the running application
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Build-only validation never holds the production deployment queue.
  group: ${{ inputs.build_only == true && format('adobe-relay-build-{0}', github.ref) || 'adobe-relay-production' }}
  cancel-in-progress: ${{ inputs.build_only == true }}
jobs:
  backend-checks:
    if: github.ref == 'refs/heads/main' || inputs.build_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: failover-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache-paths
        working-directory: backend
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # The lockfile-only setup-go key never refreshed after an exact hit,
      # leaving newly compiled unit/race packages absent from later runs.
      - name: Restore and update Go caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-adobe-relay-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-adobe-relay-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-adobe-relay-go-${{ steps.go.outputs.go-version }}-
      - name: Check deployment scripts and backend
        env:
          PROXY_FAILOVER_TEST_DATABASE_URL: postgres://postgres:failover-test@localhost:5432/postgres?sslmode=disable
          OKAD_RECOVERY_TEST_DATABASE_URL: postgres://postgres:failover-test@localhost:5432/postgres?sslmode=disable
        run: |
          # Keep compiled dependencies, but execute tests against this run's DB.
          go clean -testcache
          bash -n deploy/clash/release-online.sh
          bash -n deploy/primary/release.sh
          bash -n deploy/primary/load-image.sh
          bash -n deploy/online/renew-ip-certificate.sh
          python3 -m unittest discover -s deploy/clash -p 'test_*.py'
          python3 -m unittest discover -s deploy/primary -p 'test_*.py'
          bash -n deploy/primary/okad-release.sh
          bash -n deploy/primary/rollback-okad-sub2.sh
          cd backend
          go test -race ./internal/clash ./internal/proxyfailover ./migrations
          CLASH_TEST_DATABASE_URL="$PROXY_FAILOVER_TEST_DATABASE_URL" go test -race ./internal/clash -run Source
          go test -tags unit -race ./internal/service -run 'FreshSnapshot|SchedulerSnapshot'
          go test -race ./internal/pkg/runtimediag
          go test -race ./internal/pkg/httputil ./internal/pkg/imagebuffer
          go test -race ./internal/repository -run TestConcurrencyRollingDeployment
          go test -race ./internal/server/middleware -run 'ImageMemory|GroupModelAllowlist|RequestBody'
          go test -race ./internal/server/routes -run 'ImageMemory|GroupModelAllowlist|AdobeImages|Composite.*Image'
          go test -tags unit -race ./internal/pkg/adobe
          go test -tags unit -race ./internal/pkg/googleapi ./internal/handler ./internal/service -run 'HTTPStatusToGoogleStatus|Adobe|Images|Image.*Safety|AsyncImage|BatchImage|PromptGuard|SecurityAudit|ImageTask'
          go test -tags unit -race ./internal/service ./internal/repository ./internal/handler/admin ./internal/server/routes -run 'Okad|Adobe|Proxy|Schedulable|BulkUpdate|AccountRuntime|AccountConnectionTest|TablePreferences|BuildSMTPMessage|SendEmail|SMTP'
          go test ./internal/repository -run 'TestExpiryRespectsLiveFailoverPolicy|TestProxyUpdate|TestOkadRecoveryPostgres|TestRecoverAdobeCookieUses|TestAccountConnectionTest|TestAdobeDelivery|TestAdobeHealth|TestAdobeAlert'
          go test -tags unit ./internal/service -run 'Test(GetAdobeUsage|AdobeUsage|BuildAdobeDegradedUsage|TestAccountConnectionAdobe|FormatAdobeTestError|AccountTestServiceSendErrorAndEnd|AccountConnectionTest|OkadRecovery)'

  frontend-checks:
    if: github.ref == 'refs/heads/main' || inputs.build_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Check frontend workflows
        run: |
          pnpm --dir frontend install --frozen-lockfile --prefer-offline --ignore-scripts
          pnpm --dir frontend exec vitest run src/components/admin/proxy/__tests__/ProxyHealthPanel.spec.ts src/components/admin/changelog/__tests__ src/components/layout/__tests__/AppSidebar.spec.ts src/router/__tests__ src/i18n/__tests__
          pnpm --dir frontend exec vitest run src/views/admin/__tests__/GroupsView.columnSettings.spec.ts src/views/admin/__tests__/GroupsView.duplicate.spec.ts src/views/admin/__tests__/GroupsView.compositePlatforms.spec.ts src/views/admin/__tests__/GroupsView.codexManifest.spec.ts
          pnpm --dir frontend exec vitest run src/views/admin/ops/components/__tests__/OpsAlertRulesCard.spec.ts src/__tests__/integration/clash-subscription.spec.ts src/stores/__tests__/clashNodeTests.spec.ts src/views/admin/__tests__/ProxiesView.filters.spec.ts src/components/account/__tests__/ProxyFailoverPanel.spec.ts src/components/admin/proxy/__tests__/ProxyAllocationModal.spec.ts src/components/account/__tests__/EditAccountModal.spec.ts src/components/account/__tests__/AccountUsageCell.spec.ts src/components/common/__tests__/ProxySelector.testing.spec.ts src/views/admin/__tests__/AccountsView src/components/admin/account/__tests__/AccountBulkActionsBar.spec.ts src/components/admin/account/__tests__/AccountTestModal.spec.ts src/components/admin/account/__tests__/AccountBulkTestModal.spec.ts src/api/admin/__tests__/accountTest.spec.ts src/components/account/__tests__/OkadIntegrationStatus.spec.ts src/components/account/__tests__/AccountStatusIndicator.spec.ts src/components/account/__tests__/AccountHealthEvidence.spec.ts src/utils/__tests__/accountStatusEvidence.spec.ts src/composables/__tests__/useAccountLiveUpdates.spec.ts src/views/admin/ops/components/__tests__/AdobeHealthReportCard.spec.ts
          pnpm --dir frontend exec vitest run src/components/admin/account/__tests__/AccountCapacityFilter.spec.ts src/components/admin/account/__tests__/AccountTableFilters.spec.ts src/components/admin/account/__tests__/AccountCompanyBadge.spec.ts src/utils/__tests__/okadAccountType.spec.ts src/api/admin/__tests__/accountFilters.spec.ts src/utils/__tests__/tablePreferences.spec.ts src/composables/__tests__/usePersistedPageSize.spec.ts src/composables/__tests__/useTableLoader.spec.ts

  # Prepare the image in parallel, keeping the final release-images artifact
  # unavailable until every original check succeeds in the build gate below.
  image-build:
    if: github.ref == 'refs/heads/main' || inputs.build_only
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: adobe-relay:${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          cache-from: |
            type=gha,scope=adobe-relay-linux-amd64
            type=gha
          # Cache export is optional. A cold build must still reach the checked
          # release artifact even when saving the next-run cache is slow.
          cache-to: type=gha,scope=adobe-relay-linux-amd64,mode=max,timeout=5m,ignore-error=true
      - name: Bundle application
        env:
          IMAGE: adobe-relay:${{ github.sha }}
        run: |
          docker save "$IMAGE" | gzip > release-images.tar.gz
          sha256sum release-images.tar.gz > release-images.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image
          path: |
            release-images.tar.gz
            release-images.tar.gz.sha256
          retention-days: 1
          compression-level: 0

  # Preserve the old contract: a successful "build" and its release-images
  # artifact mean both check suites and image construction have passed.
  build:
    needs: [backend-checks, frontend-checks, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-image
      - name: Verify checked release archive
        run: sha256sum -c release-images.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: |
            release-images.tar.gz
            release-images.tar.gz.sha256
          retention-days: 1
          compression-level: 0

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.build_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Deploy primary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-images
      - name: Verify image archive and configure SSH
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          sha256sum -c release-images.tar.gz.sha256
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload, back up and deploy
        env:
          DEPLOY_HOST: 173.234.15.150
          IMAGE: adobe-relay:${{ github.sha }}
        run: |
          set -euo pipefail
          target="root@$DEPLOY_HOST"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20)
          ssh "${ssh_opts[@]}" "$target" 'mkdir -p /opt/adobe-relay/deploy/primary'
          scp "${ssh_opts[@]}" deploy/primary/{release.sh,README.md} "$target:/opt/adobe-relay/deploy/primary/"
          bash deploy/primary/load-image.sh release-images.tar.gz "$target" "${ssh_opts[@]}"
          ssh "${ssh_opts[@]}" "$target" "bash /opt/adobe-relay/deploy/primary/release.sh '$IMAGE'"
      - name: Verify public HTTPS endpoint
        env:
          HEALTH_URL: https://creative.cheap/health
        run: curl --fail --show-error --retry 6 --retry-delay 5 --max-time 30 "$HEALTH_URL"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
