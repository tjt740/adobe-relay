name: Adobe 401 repair operations
on:
  workflow_dispatch:
    inputs:
      build_only:
        type: boolean
        default: true
      operation:
        type: choice
        default: status
        options: [status, batch, stabilize, recheck, primary-diagnostic, primary-repair, prepare, release, verify, defer-old, defer-canary]
concurrency:
  group: adobe-401-repair-operations
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  operation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure the existing primary connection
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@173.234.15.150 'mkdir -p /opt/adobe-relay/releases/adobe-401-operations-20261020 && chmod 700 /opt/adobe-relay/releases/adobe-401-operations-20261020'
          tar -czf - deploy/primary/adobe-401-status.py deploy/primary/adobe-401-control.py deploy/primary/adobe-401-pilot.py deploy/primary/adobe-401-batch-v2.py deploy/primary/adobe-401-host-worker.py deploy/primary/adobe-401-stabilize.py deploy/primary/adobe-401-primary-diagnostic.py deploy/primary/adobe-401-primary-repair.py | ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'tar -xzf - -C /opt/adobe-relay/releases/adobe-401-operations-20261020'
      - name: Obtain the exact successful application artifact
        if: inputs.operation == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/tjt740/adobe-relay/actions/runs/39431314719 > ci-run.json
          gh run download 39431314719 --repo tjt740/adobe-relay --name release-images --dir artifact
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('ci-run.json').read_text())
          assert r['head_sha']=='8241adfe9a5850095ef6ea06ab2e9c2f991b0f48' and r['conclusion']=='success' and r['status']=='completed'
          p=pathlib.Path('artifact');digest=hashlib.sha256((p/'release-images.tar.gz').read_bytes()).hexdigest()
          assert (p/'release-images.tar.gz.sha256').read_text().split()==[digest,'release-images.tar.gz']
          (p/'ci-proof.json').write_text(json.dumps({'application_sha':r['head_sha'],'workflow_run':r['id'],'conclusion':r['conclusion'],'archive_sha256':digest}))
          print('Exact successful application artifact verified')
          PY
          ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'test ! -e /opt/adobe-relay/releases/adobe-401-repair-20261020/rolling-prepared.json && mkdir -p /opt/adobe-relay/releases/adobe-401-repair-20261020/artifact && chmod 700 /opt/adobe-relay/releases/adobe-401-repair-20261020'
          tar -czf - -C deploy/primary/adobe-401-repair-20261020 . | ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'tar -xzf - -C /opt/adobe-relay/releases/adobe-401-repair-20261020'
          tar -cf - -C artifact . | ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'umask 077; tar -xf - -C /opt/adobe-relay/releases/adobe-401-repair-20261020/artifact'
      - name: Execute the selected guarded operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            batch) ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'python3 /opt/adobe-relay/releases/adobe-401-operations-20261020/deploy/primary/adobe-401-batch-v2.py' ;;
            stabilize) ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'python3 /opt/adobe-relay/releases/adobe-401-operations-20261020/deploy/primary/adobe-401-stabilize.py' ;;
            primary-repair) ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'python3 /opt/adobe-relay/releases/adobe-401-operations-20261020/deploy/primary/adobe-401-primary-repair.py' ;;
            primary-diagnostic) ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'python3 /opt/adobe-relay/releases/adobe-401-operations-20261020/deploy/primary/adobe-401-primary-diagnostic.py' ;;
            status) ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@173.234.15.150 'python3 /opt/adobe-relay/releases/adobe-401-operations-20261020/deploy/primary/adobe-401-status.py' ;;
            prepare|release|verify|defer-old|defer-canary|recheck) ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=3 root@173.234.15.150 "python3 /opt/adobe-relay/releases/adobe-401-operations-20261020/deploy/primary/adobe-401-control.py $OPERATION" ;;
            *) exit 2 ;;
          esac
