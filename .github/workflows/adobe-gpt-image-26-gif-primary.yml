name: Read-only setup and authorized 2.6 API capability tests
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preflight, run, business, status]
        required: true
        default: preflight
      key_id:
        type: string
        default: '12'
permissions:
  contents: read
concurrency:
  group: ${{ inputs.phase == 'status' && format('image26-readonly-{0}', github.run_id) || 'adobe-relay-production' }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare existing server access
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Inspect current progress without new requests
        if: inputs.phase == 'status'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@173.234.15.150 python3 - <<'PYREMOTE'
          import json,pathlib
          p=pathlib.Path('/opt/adobe-relay/diagnostics/image26-capability-20261107/business-group15')
          r=json.loads((p/'results.json').read_text()) if (p/'results.json').exists() else []
          print(json.dumps({'completed':len(r),'recent':[{'case':v['case'],'status':v.get('http_status'),'seconds':v.get('duration_seconds'),'images':v.get('images',[]),'error':v.get('error')} for v in r[-6:]],'started':len(list(p.glob('*-started.json')))}))
          PYREMOTE
      - name: Run capability inspection only
        if: inputs.phase != 'status'
        env:
          PHASE: ${{ inputs.phase }}
          TEST_KEY_ID: ${{ inputs.key_id }}
        run: |
          set -euo pipefail
          [[ "$PHASE" == preflight || "$PHASE" == run || "$PHASE" == business ]]
          [[ "$TEST_KEY_ID" =~ ^[0-9]+$ ]]
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@173.234.15.150 'umask 077; mkdir -p /opt/adobe-relay/diagnostics/image26-capability-20261107'
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/diagnostics/image26-capability-20261107/probe.py root@173.234.15.150:/opt/adobe-relay/diagnostics/image26-capability-20261107/probe.py
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/diagnostics/image26-capability-20261107/business.py root@173.234.15.150:/opt/adobe-relay/diagnostics/image26-capability-20261107/business.py
          if [ "$PHASE" == business ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=10 root@173.234.15.150 'python3 /opt/adobe-relay/diagnostics/image26-capability-20261107/business.py'
          else
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=10 root@173.234.15.150 "python3 /opt/adobe-relay/diagnostics/image26-capability-20261107/probe.py $PHASE $TEST_KEY_ID"
          fi
      - name: Download sanitized evidence
        if: always()
        run: |
          mkdir -p evidence
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes 'root@173.234.15.150:/opt/adobe-relay/diagnostics/image26-capability-20261107/*.json' evidence/ || true
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes 'root@173.234.15.150:/opt/adobe-relay/diagnostics/image26-capability-20261107/*-0.*' evidence/ || true
          scp -r -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes 'root@173.234.15.150:/opt/adobe-relay/diagnostics/image26-capability-20261107/business-group15' evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image26-capability-evidence
          path: evidence/
          retention-days: 7
      - name: Remove temporary SSH file
        if: always()
        run: rm -f ~/.ssh/deploy_key
