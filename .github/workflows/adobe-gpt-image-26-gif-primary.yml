name: Read-only Image 2.6 quality verification
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [status]
        default: status
        required: true
      application_sha:
        type: string
        required: true
      build_run:
        type: string
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read existing diagnostic results without running generation
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          mkdir -p evidence
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 root@173.234.15.150 'python3 -' > evidence/readback.tar.gz <<'PY'
          import io,pathlib,tarfile,sys,json,subprocess,datetime
          root=pathlib.Path('/opt/adobe-relay/diagnostics/image26-quality-20261107')
          names=list(root.glob('*.json'))+list((root/'public-baseline').glob('*.json'))+list((root/'native').glob('*.json'))
          names += [p for p in [root/'native.log',root/'public.log'] if p.is_file()]
          c=json.loads(subprocess.check_output(['docker','inspect','adobe-relay-app-1']))[0]
          state={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'image':c['Config']['Image'],'container_id':c['Id'],'health':c['State']['Health']['Status'],'restarts':c['RestartCount'],'oom':c['State']['OOMKilled'],'native_complete':(root/'native/run-complete.json').exists()}
          with tarfile.open(fileobj=sys.stdout.buffer,mode='w|gz') as t:
              for p in names:
                  assert p.is_file() and p.stat().st_size<2000000
                  t.add(p,arcname=str(p.relative_to(root)),recursive=False)
              b=json.dumps(state,indent=2).encode();info=tarfile.TarInfo('readback-state.json');info.size=len(b);t.addfile(info,io.BytesIO(b))
          PY
          tar -xzf evidence/readback.tar.gz -C evidence
          cat evidence/readback-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image26-quality-readback
          path: evidence/
          retention-days: 7
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
