name: Verify group ID default visibility
on:
  workflow_dispatch:
    inputs:
      application_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: adobe-relay-production
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure primary SSH
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Verify deployed application and protected state
        env:
          EXPECTED_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15)
          target=root@173.234.15.150
          audit=/opt/adobe-relay/releases/group-id-visible-20261016
          scp "${opts[@]}" deploy/primary/{image-response-release,group-id-visible-release,group-id-business-verify,group-id-final-verify}.py "$target:$audit/"
          printf '%s\n' "$EXPECTED_SHA" > expected-sha
          scp "${opts[@]}" expected-sha "$target:$audit/expected-sha"
          ssh "${opts[@]}" "$target" "python3 $audit/group-id-visible-release.py after"
          ssh "${opts[@]}" "$target" "python3 $audit/group-id-business-verify.py"
          for attempt in 1 2 3 4 5 6 7 8; do
            if ssh "${opts[@]}" "$target" "python3 $audit/group-id-final-verify.py"; then break; fi
            if [ "$attempt" = 8 ]; then exit 1; fi
            sleep 20
          done
          ssh "${opts[@]}" "$target" "python3 $audit/group-id-visible-release.py check-rollback"
          mkdir -p audit-results
          scp "${opts[@]}" "$target:$audit/*.json" audit-results/
      - uses: actions/upload-artifact@v4
        with:
          name: group-id-visible-audit
          path: audit-results/
          retention-days: 30
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
