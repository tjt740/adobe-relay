name: Adobe image model catalog test
on:
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact deployed application commit to verify
        type: string
        required: true
      branch:
        description: Source branch containing the catalog-test helper
        type: string
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: adobe-relay-production
  cancel-in-progress: false
jobs:
  catalog-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh catalog-test-evidence
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Verify public and admin model directories
        env:
          APP_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          target='root@173.234.15.150'
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20)
          ssh "${ssh_opts[@]}" "$target" 'mkdir -p /opt/adobe-relay/releases/adobe-gpt-image-26-20261106'
          scp "${ssh_opts[@]}" deploy/primary/adobe-gpt-image-26-20261106/catalog-test.py "$target:/opt/adobe-relay/releases/adobe-gpt-image-26-20261106/"
          ssh "${ssh_opts[@]}" "$target" "python3 /opt/adobe-relay/releases/adobe-gpt-image-26-20261106/catalog-test.py '$APP_SHA'" | tee catalog-test-evidence/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adobe-image-model-catalog-test
          path: catalog-test-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
