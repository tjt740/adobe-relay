name: Isolated Adobe web contract audit
on:
  workflow_dispatch:
    inputs:
      application_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: adobe-web-contract-20261028
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check unchanged application sources
        env:
          APP_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          test "$APP_SHA" = df07b90d7e2ce8e27fd7a9deb11336eaf5077e3c
          git diff --exit-code "$APP_SHA" -- backend/internal backend/go.mod backend/go.sum frontend Dockerfile deploy/docker-entrypoint.sh
          python3 -m py_compile deploy/primary/adobe-web-contract-20261028/read_audit.py
      - name: Collect read-only sanitized incident evidence
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          mkdir -p incident-evidence
          ssh -C -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 root@173.234.15.150 'python3 - final_audit' < deploy/primary/adobe-web-contract-20261028/read_audit.py > incident-evidence/read-only-audit.json
          python3 - <<'PYOUT'
          import json
          d=json.load(open('incident-evidence/read-only-audit.json'))
          if isinstance(d.get('result'),dict):
              r=d['result']
              keep=['account_id','proxy_id','step','error_class','error_step','error_frames','jobs','actual_web_request','main_payload_for_matched_inputs','payload_difference_keys','onboarding_dismissed','frame_urls','native_tokens','same_browser_auth_contract_comparison','identity_verification','credential_selection','old_scope_generation_auth','generation_token']
              d['result']={k:r[k] for k in keep if k in r}
          print(json.dumps(d,ensure_ascii=False))
          PYOUT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adobe-web-contract-evidence
          path: incident-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
