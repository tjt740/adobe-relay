name: Adobe bounded three-arm diagnostic
on:
  workflow_dispatch:
    inputs:
      application_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: adobe-three-arm-20261027
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check unchanged application sources
        env:
          APP_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          test "$APP_SHA" = df07b90d7e2ce8e27fd7a9deb11336eaf5077e3c
          git diff --exit-code "$APP_SHA" -- backend/internal backend/go.mod backend/go.sum frontend Dockerfile deploy/docker-entrypoint.sh
          python3 -m py_compile deploy/primary/session-controlled-20261027/read_audit.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: backend/go.sum
      - name: Build bounded diagnostic with unchanged production SDK
        working-directory: backend
        run: |
          go test ./cmd/expandedprobe
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/expandedprobe ./cmd/expandedprobe
      - name: Collect read-only sanitized incident evidence
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          mkdir -p incident-evidence
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 /tmp/expandedprobe root@173.234.15.150:/opt/adobe-relay/releases/three-arm-20261027/expandedprobe
          ssh -C -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 root@173.234.15.150 'python3 -' < deploy/primary/session-controlled-20261027/read_audit.py > incident-evidence/read-only-audit.json
          cat incident-evidence/read-only-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adobe-401-read-only-evidence
          path: incident-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
