name: Read blue image request evidence
on:
  workflow_dispatch:
    inputs:
      application_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: blue-image-links-readonly-20261110
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read request metadata only
        env:
          SSH_KEY: ${{ secrets.PRIMARY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          mkdir -p incident-evidence
          timeout 220 ssh -C -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 root@173.234.15.150 'python3 -u -' < deploy/primary/blue-image-links-20261110/read.py > incident-evidence/evidence.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-image-links-evidence
          path: incident-evidence/
          retention-days: 3
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/deploy_key
