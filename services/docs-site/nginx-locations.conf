# Standalone, authenticated documentation; preserve the existing batch-image alias.
location = /docs { return 308 /docs/; }
location = /docs/batch-image { return 302 /batch-image$is_args$args; }
location ^~ /docs/auth/ {
    limit_req zone=creative_docs_auth burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/creative-docs-proxy.conf;
}
location ^~ /docs/ {
    limit_req zone=creative_docs_read burst=20 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/creative-docs-proxy.conf;
}
