limit_req_zone $binary_remote_addr zone=creative_docs_auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=creative_docs_read:1m rate=60r/m;
server {
    listen 443 ssl;
    server_name docs.creative.cheap;
    ssl_certificate /etc/letsencrypt/live/docs.creative.cheap/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.creative.cheap/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Deliberately omit query strings and never log bodies/cookies/auth headers.
    access_log /var/log/nginx/creative-docs-access.log creative_docs;
    error_log /var/log/nginx/creative-docs-error.log warn;
    limit_req_status 429;
    location /auth/ {
        limit_req zone=creative_docs_auth burst=5 nodelay;
        include /etc/nginx/snippets/creative-docs-proxy.conf;
    }
    location / {
        limit_req zone=creative_docs_read burst=20 nodelay;
        include /etc/nginx/snippets/creative-docs-proxy.conf;
    }
}
