if ($host != creative.cheap) { return 308 https://creative.cheap$request_uri; }
client_max_body_size 16k;
access_log /var/log/nginx/creative-docs-access.log creative_docs;
proxy_pass http://127.0.0.1:6670;
proxy_set_header Host creative.cheap;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header X-CDN-Client-IP "";
proxy_set_header Connection "";
proxy_http_version 1.1;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_cache off;
proxy_buffering off;
